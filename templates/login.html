<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Aether AI</title>

  <link rel="stylesheet" href="/static/style.css">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:
      radial-gradient(circle at top left,#460014,#000814 55%);
      overflow:hidden;
    }

    .auth-container{
      width:420px;
      background:rgba(10,10,18,0.92);
      border:1px solid rgba(255,0,85,0.2);
      border-radius:30px;
      padding:45px;
      box-shadow:
      0 0 40px rgba(255,0,85,0.12);
      backdrop-filter:blur(14px);
    }

    .logo{
      width:70px;
      height:70px;
      border-radius:22px;
      background:linear-gradient(135deg,#ff2f68,#ff0055);
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
      font-size:30px;
      margin-bottom:28px;
      box-shadow:0 0 30px rgba(255,0,85,0.4);
    }

    h1{
      color:white;
      font-size:52px;
      margin-bottom:12px;
      font-weight:800;
    }

    .sub{
      color:#c9a7b3;
      margin-bottom:34px;
      line-height:1.5;
      font-size:16px;
    }

    form{
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    input{
      width:100%;
      padding:18px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,0.08);
      background:#0b0f1a;
      color:white;
      font-size:16px;
      outline:none;
      transition:0.3s;
    }

    input:focus{
      border-color:#ff2f68;
      box-shadow:0 0 15px rgba(255,0,85,0.25);
    }

    button{
      height:58px;
      border:none;
      border-radius:18px;
      background:linear-gradient(135deg,#ff4d79,#d8004f);
      color:white;
      font-size:18px;
      font-weight:700;
      cursor:pointer;
      transition:0.3s;
      margin-top:8px;
    }

    button:hover{
      transform:translateY(-2px);
      box-shadow:0 10px 30px rgba(255,0,85,0.3);
    }

    .bottom{
      margin-top:24px;
      text-align:center;
      color:#c8b6be;
      font-size:15px;
    }

    .bottom a{
      color:#ff4d79;
      text-decoration:none;
      font-weight:700;
    }

    .bottom a:hover{
      text-decoration:underline;
    }

    @media(max-width:500px){

      .auth-container{
        width:92%;
        padding:30px;
      }

      h1{
        font-size:42px;
      }

    }

  </style>
</head>

<body>

  <div class="auth-container">

    <div class="logo">✦</div>

    <h1>Welcome Back</h1>

    <p class="sub">
      Login to continue your conversations with Aether AI.
    </p>

    <form method="POST">

      <input
        type="text"
        name="username"
        placeholder="Username"
        required
      >

      <input
        type="password"
        name="password"
        placeholder="Password"
        required
      >

      <button type="submit">
        Login
      </button>

    </form>

    <div class="bottom">
      Don’t have an account?
      <a href="/signup">Sign up</a>
    </div>

  </div>

</body>
</html>
